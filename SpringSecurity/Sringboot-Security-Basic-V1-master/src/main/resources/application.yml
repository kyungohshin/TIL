server:
  port: 8088
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:h2:file:~/testdb?serverTimezone=Asia/Seoul
    username: cos
    password: cos1231!
  #mustache:
   # expose-request-attributes: true

# 알아서 디폴트로 아래경로로 잡아주기때문에 생략가능   
  mvc:
    view:
      prefix: /templates/
      suffix: .html

  jpa:
    hibernate:
      ddl-auto: update #create update none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 897462119955-39o9hhnmajlnnarruq0aurn78nmpvfnp.apps.googleusercontent.com
            client-secret: 비공개
            #redirect-uri: http://localhost:8088/login/oauth2/code/google provider를 기본적으로 고정값을 제공해주므로 굳이 안써줘도됨
            scope:
            - email
            - profile

          facebook:
            client-id: 7008751099148352
            client-secret: 비공개
            #redirect-uri: http://localhost:8088/login/oauth2/code/facebook provider를 기본적으로 고정값을 제공해주므로 굳이 안써줘도됨
            scope:
            - email
            - public_profile # facebook에서 제공해주는 scope의 이름을 적어야함. 사이트가면 다 나와있음

          naver:
            client-id: DVIz_xEyGrkOQLnTsLta
            client-secret: 비공개
            scope:
            - name
            - email
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8088/login/oauth2/code/naver # provider를 기본적으로 제공해주지 않으므로 써줘야함

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize # 네이버 로그인을 누른순간 이주소로 요청을 날림
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response # 회원정보를 json으로 받는데, response라는 키값으로 네이버가 리턴해줌.


